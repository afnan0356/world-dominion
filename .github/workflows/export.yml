name: Build artifacts

## Two build paths, and what each one promises.
##
##   bundle  — always succeeds. A reproducible zip of the project plus a manifest of its
##             own contents; open it in Godot 4.6.3 and play.
##   android — attempts a real APK with the export template and the Android SDK. When the
##             template or the SDK cannot be fetched, this job records the exact failure in
##             build/EXPORT_REPORT.md and uploads that instead. It never uploads a file it
##             did not build, and it never calls a failed export a success.
##
## Both jobs are manual: nothing here runs on a push, so a red artifact build cannot block
## work on the game itself. The validation workflow is the gate.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the artifacts (default: the project's own version)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  bundle:
    name: Project bundle (always produced)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prove the bundle tool is reproducible
        run: python3 tools/build_project_bundle.py --self-test

      - name: Build the bundle
        id: build
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="$(grep -m1 -o 'config/version="[^"]*"' project.godot \
              | sed 's/.*="//; s/"$//')"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="0.0.0"
          fi
          python3 tools/build_project_bundle.py --out "dist/world-dominion-${VERSION}.zip"
          python3 tools/build_project_bundle.py --verify "dist/world-dominion-${VERSION}.zip"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          sha256sum "dist/world-dominion-${VERSION}.zip" | tee dist/SHA256SUMS.txt

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: world-dominion-bundle-${{ steps.build.outputs.version }}
          path: |
            dist/world-dominion-*.zip
            dist/world-dominion-*.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android APK (attempted, never faked)
    runs-on: ubuntu-latest
    needs: bundle
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Godot with its export templates
        id: godot
        continue-on-error: true
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true

      - name: Set up the Android SDK
        id: sdk
        continue-on-error: true
        run: |
          set -uo pipefail
          yes | "${ANDROID_HOME:-$HOME/android-sdk}/cmdline-tools/latest/bin/sdkmanager" \
            --licenses > /dev/null 2>&1 || true
          "${ANDROID_HOME:-$HOME/android-sdk}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" \
            > sdk-install.log 2>&1

      - name: Import project resources
        continue-on-error: true
        run: godot --headless --path . --import

      - name: Attempt the export
        id: export
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p build
          godot --headless --path . --export-debug "Android Debug" \
            "build/world-dominion.apk" > build/export.log 2>&1
          test -s "build/world-dominion.apk"

      - name: Record what happened, in one page
        if: always()
        run: |
          set -uo pipefail
          mkdir -p build
          {
            echo "# Export report"
            echo
            echo "Generated by \`.github/workflows/export.yml\`. It states what this run"
            echo "actually produced — nothing here is a promise about a future run."
            echo
            if [ -s build/world-dominion.apk ]; then
              echo "## Result"
              echo
              echo "**An APK was produced.**"
              echo
              echo '```'
              sha256sum build/world-dominion.apk
              ls -l build/world-dominion.apk
              echo '```'
            else
              echo "## Result: no APK was produced"
              echo
              echo "The export did not complete. The reason, in the engine's own words, is"
              echo "below; the project bundle from this same run is still a working build."
              echo
              for log in build/export.log sdk-install.log; do
                if [ -s "$log" ]; then
                  echo "### \`$log\`"
                  echo
                  echo '```'
                  tail -n 40 "$log"
                  echo '```'
                  echo
                fi
              done
              echo "### What this means"
              echo
              echo "The Android path needs the *export template for the exact engine build*"
              echo "and an Android SDK with platform 34 and build-tools 34.0.0. Where either"
              echo "is unavailable to CI, this job records that here instead of shipping a"
              echo "file it did not build. See \`docs/BUILD.md\`."
            fi
          } > build/EXPORT_REPORT.md
          cat build/EXPORT_REPORT.md

      - name: Upload the export attempt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-export-attempt
          path: |
            build/world-dominion.apk
            build/EXPORT_REPORT.md
            build/export.log
          if-no-files-found: warn
          retention-days: 30

      - name: State the outcome in the run summary
        if: always()
        run: |
          if [ -s build/world-dominion.apk ]; then
            echo "### Android export: APK produced" >> "$GITHUB_STEP_SUMMARY"
            sha256sum build/world-dominion.apk >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Android export: no APK — see build/EXPORT_REPORT.md" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
