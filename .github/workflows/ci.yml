name: Validation

# Static analysis plus the headless test suite. No build artefacts are produced:
# export presets are introduced in a later milestone (see ROADMAP.md).

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gdtoolkit
        run: pip install gdtoolkit==4.5.0

      - name: Lint GDScript
        run: gdlint src tests tools

      - name: Check atlas data integrity
        run: python3 tools/check_atlas_data.py

      - name: Validate atlas data and report freshness
        run: python3 tools/validate_world_atlas.py --check-report docs/DATA_QUALITY.md

      - name: Verify the runtime pack matches the per-country folders
        run: python3 tools/build_country_pack.py --check

      - name: Validate the per-country folder tree
        run: python3 tools/validate_country_folders.py

      - name: Test the folder validator against deliberately broken fixtures
        run: python3 tools/validate_country_folders.py --self-test

      - name: Check generated policy documents are fresh
        run: python3 tools/report_policies.py --check

      - name: Check the data completeness report is fresh
        run: python3 tools/report_data_completeness.py --check

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: false

      - name: Import project resources
        run: godot --headless --path . --import

      - name: Parse-check every changed GDScript file
        id: parse
        run: |
          mkdir -p /tmp/logs
          base=$(git merge-base HEAD origin/main || echo "")
          files=$(git diff --name-only "$base" -- '*.gd' 2>/dev/null || git ls-files '*.gd')
          : > /tmp/logs/parse.log
          for f in $files; do
            echo "== $f" >> /tmp/logs/parse.log
            godot --headless --path . --check-only --script "res://$f" >> /tmp/logs/parse.log 2>&1 || true
          done
          # `--check-only --script` loads one script without the project's autoloads, so a
          # reference to the Settings / ThemeManager / Game singletons is reported as a
          # missing identifier even though the script is fine. Every other compile error
          # is real and fails this step.
          python3 - <<'PY'
          import sys
          allowed = ("Identifier not found: ThemeManager", "Identifier not found: Settings",
                     "Identifier not found: Game", "Failed to compile depended scripts",
                     "Compilation failed")
          try:
              lines = open("/tmp/logs/parse.log", errors="replace").read().splitlines()
          except OSError:
              sys.exit(0)
          bad = [line for line in lines
                 if ("Parse Error" in line or "SCRIPT ERROR" in line)
                 and not any(name in line for name in allowed)]
          if bad:
              print("compile errors found:")
              print("\n".join(bad[:40]))
              sys.exit(1)
          print("no compile errors outside the known autoload false positives")
          PY

      - name: Run headless test suite
        id: suite
        timeout-minutes: 8
        run: |
          mkdir -p /tmp/logs
          stdbuf -oL -eL godot --headless --path . res://tests/test_runner.tscn 2>&1 | tee /tmp/logs/suite.log

      - name: Run the simulation and save benchmark
        id: benchmark
        timeout-minutes: 4
        run: |
          mkdir -p /tmp/logs
          stdbuf -oL -eL godot --headless --path . res://tools/sim_benchmark.tscn 2>&1 | tee /tmp/logs/suite.log.bench
          cat /tmp/logs/suite.log.bench >> /tmp/logs/suite.log

      - name: Boot smoke test
        id: boot
        timeout-minutes: 3
        run: |
          mkdir -p /tmp/logs
          status=0
          timeout 180 godot --headless --path . --quit-after 240 res://src/app/main.tscn \
            > /tmp/logs/boot.log 2>&1 || status=$?
          tail -40 /tmp/logs/boot.log
          # A headless boot exits 0 even after a script error, so the log is what is
          # checked: the title screen must come up without a single script error.
          python3 - <<'PY'
          import sys
          try:
              text = open("/tmp/logs/boot.log", errors="replace").read()
          except OSError:
              print("no boot log")
              sys.exit(1)
          bad = [line for line in text.splitlines()
                 if "SCRIPT ERROR" in line or "Parse Error" in line]
          if bad:
              print("the title screen logged script errors:")
              print("\n".join(bad[:20]))
              sys.exit(1)
          print("title screen booted with no script errors")
          PY
          if [ "$status" -ne 0 ]; then
            echo "boot exited with status $status"
            exit "$status"
          fi

      # The logs are published as commit comments so a run can be read without the
      # Actions log viewer: this repository is developed in an environment that cannot
      # fetch job logs, and a comment survives as a per-commit record of the evidence.
      # It runs on failure too, which is exactly when the log matters.
      - name: Publish logs as commit comments
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          def post(body):
              payload = json.dumps({"body": body[:60000]})
              subprocess.run(["curl", "-sS", "-X", "POST",
                              "-H", "Authorization: Bearer " + token,
                              "-H", "Accept: application/vnd.github+json",
                              "https://api.github.com/repos/%s/commits/%s/comments" % (repo, sha),
                              "--data", payload], check=False)
          for name in ("parse", "suite", "boot"):
              path = "/tmp/logs/%s.log" % name
              try:
                  with open(path, "r", errors="replace") as handle:
                      lines = handle.read().splitlines()
              except OSError:
                  lines = ["(no %s log)" % name]
              post("### %s log — %d lines (part 1)\n```\n%s\n```" %
                   (name, len(lines), "\n".join(lines[:700])))
              if len(lines) > 700:
                  post("### %s log — part 2\n```\n%s\n```" %
                       (name, "\n".join(lines[700:1400])))
              if len(lines) > 1400:
                  post("### %s log — part 3 (tail)\n```\n%s\n```" %
                       (name, "\n".join(lines[-400:])))
          PY
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
