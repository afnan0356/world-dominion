name: Validation

# Static analysis plus the headless test suite. No build artefacts are produced:
# export presets are introduced in a later milestone (see ROADMAP.md).

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gdtoolkit
        run: pip install gdtoolkit==4.5.0

      - name: Lint GDScript
        run: gdlint src tests tools

      - name: Check atlas data integrity
        run: python3 tools/check_atlas_data.py

      - name: Validate atlas data and report freshness
        run: python3 tools/validate_world_atlas.py --check-report docs/DATA_QUALITY.md

      - name: Check generated policy documents are fresh
        run: python3 tools/report_policies.py --check

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: false

      - name: Import project resources
        run: godot --headless --path . --import

      - name: Run headless test suite
        id: suite
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set -o pipefail
          stdbuf -oL -eL godot --headless --path . res://tests/test_runner.tscn 2>&1 | tee /tmp/suite.log

      - name: Publish suite log as a commit comment
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          text = ""
          try:
              with open("/tmp/suite.log", "r", errors="replace") as handle:
                  text = handle.read()
          except OSError:
              text = "(no log captured)"
          lines = text.splitlines()
          tail = "\n".join(lines[-200:]) if lines else "(empty log)"
          body = "CI suite log (last 200 lines of %d):\n\n```\n%s\n```" % (len(lines), tail)
          sha = os.environ["GITHUB_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]
          payload = json.dumps({"body": body[:60000]})
          subprocess.run(["curl", "-sS", "-X", "POST",
                          "-H", "Authorization: Bearer " + os.environ["GITHUB_TOKEN"],
                          "-H", "Accept: application/vnd.github+json",
                          "https://api.github.com/repos/%s/commits/%s/comments" % (repo, sha),
                          "--data", payload], check=False)
          PY
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
