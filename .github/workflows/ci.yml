name: Validation

# Static analysis plus the headless test suite. No build artefacts are produced:
# export presets are introduced in a later milestone (see ROADMAP.md).

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gdtoolkit
        run: pip install gdtoolkit==4.5.0

      - name: Lint GDScript
        run: gdlint src tests tools

      - name: Check atlas data integrity
        run: python3 tools/check_atlas_data.py

      # The figures are a separate claim about the same source bytes, so they get their
      # own gates. The pinned source itself is git-ignored and is not downloaded here
      # (CI must not depend on a network fetch), so these steps check everything that can
      # be checked from the committed bytes: the builder's rejection rules, the pack
      # against the folders, the manifest hash, the years, and the crosswalk against the
      # registry. `tools/build_statistics.py --check` and the report freshness check run
      # where `data/source/` exists, which is documented in CONTRIBUTING.md.
      - name: Test the statistics builder's own rules
        run: python3 tools/build_statistics.py --self-test

      - name: Validate the statistics data
        run: python3 tools/validate_statistics.py

      # The codes and the picker groups are generated from the pinned source, and the
      # folder validator checks every record against them. The self-test proves the rules
      # themselves (a parent's code is never borrowed, XK is not official).
      - name: Test the progression curve and its document
        run: python3 tools/build_progression_doc.py --self-test

      - name: Check the progression document is fresh
        run: python3 tools/build_progression_doc.py --check

      - name: Test the country-code and region rules
        run: python3 tools/build_country_codes.py --self-test

      - name: Check the control-size report is fresh
        run: python3 tools/control_size_report.py --check

      - name: Validate atlas data and report freshness
        run: python3 tools/validate_world_atlas.py --check-report docs/DATA_QUALITY.md

      - name: Verify the runtime pack matches the per-country folders
        run: python3 tools/build_country_pack.py --check

      - name: Validate the per-country folder tree
        run: python3 tools/validate_country_folders.py

      - name: Check the coastline hints are up to date
        run: python3 tools/build_coast_data.py --check

      - name: Test the folder validator against deliberately broken fixtures
        run: python3 tools/validate_country_folders.py --self-test

      - name: Check generated policy documents are fresh
        run: python3 tools/report_policies.py --check

      - name: Check the animation inventory is fresh
        run: python3 tools/report_animations.py --check

      - name: Check the data completeness report is fresh
        run: python3 tools/report_data_completeness.py --check

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: false

      - name: Import project resources
        run: godot --headless --path . --import

      - name: Parse-check every changed GDScript file
        id: parse
        run: |
          mkdir -p /tmp/logs
          base=$(git merge-base HEAD origin/main || echo "")
          files=$(git diff --name-only "$base" -- '*.gd' 2>/dev/null || git ls-files '*.gd')
          : > /tmp/logs/parse.log
          for f in $files; do
            echo "== $f" >> /tmp/logs/parse.log
            godot --headless --path . --check-only --script "res://$f" >> /tmp/logs/parse.log 2>&1 || true
          done
          # `--check-only --script` loads one script without the project's autoloads, so a
          # reference to the Settings / ThemeManager / Game singletons is reported as a
          # missing identifier even though the script is fine. Every other compile error
          # is real and fails this step.
          python3 - <<'PY'
          import sys
          allowed = ("Identifier not found: ThemeManager", "Identifier not found: Settings",
                     "Identifier not found: Game", "Failed to compile depended scripts",
                     "Compilation failed")
          try:
              lines = open("/tmp/logs/parse.log", errors="replace").read().splitlines()
          except OSError:
              sys.exit(0)
          # Report each error with the file it belongs to: the log records a "== file"
          # header before each script, and an error without its file is half a report.
          # Report each error with the file it belongs to and the line before it: Godot
          # prints the script path and line number on the line above the message, and an
          # error without its location is not actionable.
          bad = []
          current = "?"
          for index, line in enumerate(lines):
              if line.startswith("== "):
                  current = line[3:].strip()
                  continue
              if ("Parse Error" in line or "SCRIPT ERROR" in line) \
                      and not any(name in line for name in allowed):
                  previous = lines[index - 1].strip() if index > 0 else ""
                  bad.append(f"{current}: {previous} || {line.strip()}")
          if bad:
              print("compile errors found:")
              print("\n".join(bad[:40]))
              # Also emitted as workflow annotations, because the step log and the
              # artifacts bucket are not reachable from every client; annotations
              # are readable through the check-runs API.
              for line in bad[:20]:
                  print(f"::error title=Compile error::{line[:600]}")
              sys.exit(1)
          print("no compile errors outside the known autoload false positives")
          PY

      # Diagnostics: when a compile error fails the step above, the step log is not
      # always retrievable from the API, so the full parse log is kept as an artifact.
      - name: Keep the parse log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parse-logs
          path: /tmp/logs
          retention-days: 3
          if-no-files-found: ignore

      - name: Run headless test suite
        id: suite
        timeout-minutes: 8
        run: |
          mkdir -p /tmp/logs
          stdbuf -oL -eL godot --headless --path . res://tests/test_runner.tscn 2>&1 | tee /tmp/logs/suite.log
          # A pipe hides godot's exit code, and the runner exits 0 even when a suite
          # fails, so the suite's own verdict is the gate.
          grep -q "^RESULT: PASS" /tmp/logs/suite.log || {
            echo "the headless suite did not pass"; exit 1; }

      # The suite's own summary, as annotations: suite count, per-suite test and
      # assertion counts, and the final result. Annotations are readable through the
      # check-runs API, which is the only evidence channel this environment can read.
      - name: Publish the suite summary as annotations
        if: always()
        run: |
          python3 - <<'PY'
          import sys
          try:
              lines = open("/tmp/logs/suite.log", errors="replace").read().splitlines()
          except OSError:
              sys.exit(0)
          keep = [line.strip() for line in lines if " tests · " in line]
          failures = [line.strip() for line in lines if line.strip().startswith("- ")]
          totals = [line.strip() for line in lines
                    if line.startswith("Assertions:") or line.startswith("RESULT:")]
          if failures:
              print(f"::error title=failures::{(' | '.join(failures))[:60000]}")
          # One annotation with every line, because GitHub keeps only a handful of
          # annotations per step and the per-suite rows are the evidence.
          if keep:
              print(f"::notice title=suites::{(' | '.join(keep))[:60000]}")
          for line in totals:
              print(f"::notice title=total::{line[:600]}")
          PY

      - name: Run the simulation and save benchmark
        id: benchmark
        timeout-minutes: 4
        run: |
          mkdir -p /tmp/logs
          status=0
          stdbuf -oL -eL godot --headless --path . res://tools/sim_benchmark.tscn \
            2>&1 | tee /tmp/logs/suite.log.bench || status=$?
          cat /tmp/logs/suite.log.bench >> /tmp/logs/suite.log
          # The pipe hides godot's exit code and the benchmark prints its own verdict,
          # so both are checked. Before this, a benchmark that crashed still left the
          # step green and the numbers in /tmp/logs read as if they had been measured.
          if ! grep -q "^BENCHMARK OK" /tmp/logs/suite.log.bench; then
            echo "the benchmark did not report BENCHMARK OK"
            grep -E "^BENCHMARK|FAILED" /tmp/logs/suite.log.bench || true
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "the benchmark process exited with status $status"
            exit "$status"
          fi

      - name: Boot smoke test
        id: boot
        timeout-minutes: 3
        run: |
          mkdir -p /tmp/logs
          status=0
          timeout 180 godot --headless --path . --quit-after 240 res://src/app/main.tscn \
            > /tmp/logs/boot.log 2>&1 || status=$?
          tail -40 /tmp/logs/boot.log
          # A headless boot exits 0 even after a script error, so the log is what is
          # checked: the title screen must come up without a single script error.
          python3 - <<'PY'
          import sys
          try:
              text = open("/tmp/logs/boot.log", errors="replace").read()
          except OSError:
              print("no boot log")
              sys.exit(1)
          bad = [line for line in text.splitlines()
                 if "SCRIPT ERROR" in line or "Parse Error" in line]
          if bad:
              print("the title screen logged script errors:")
              print("\n".join(bad[:20]))
              for line in bad[:20]:
                  print(f"::error title=Boot script error::{line[:600]}")
              sys.exit(1)
          print("title screen booted with no script errors")
          PY
          if [ "$status" -ne 0 ]; then
            echo "boot exited with status $status"
            exit "$status"
          fi

      # The logs are published as commit comments so a run can be read without the
      # Actions log viewer: this repository is developed in an environment that cannot
      # fetch job logs, and a comment survives as a per-commit record of the evidence.
      # It runs on failure too, which is exactly when the log matters.
      - name: Publish logs as commit comments
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          def post(body):
              payload = json.dumps({"body": body[:60000]})
              subprocess.run(["curl", "-sS", "-X", "POST",
                              "-H", "Authorization: Bearer " + token,
                              "-H", "Accept: application/vnd.github+json",
                              "https://api.github.com/repos/%s/commits/%s/comments" % (repo, sha),
                              "--data", payload], check=False)
          for name in ("parse", "suite", "boot"):
              path = "/tmp/logs/%s.log" % name
              try:
                  with open(path, "r", errors="replace") as handle:
                      lines = handle.read().splitlines()
              except OSError:
                  lines = ["(no %s log)" % name]
              post("### %s log — %d lines (part 1)\n```\n%s\n```" %
                   (name, len(lines), "\n".join(lines[:700])))
              if len(lines) > 700:
                  post("### %s log — part 2\n```\n%s\n```" %
                       (name, "\n".join(lines[700:1400])))
              if len(lines) > 1400:
                  post("### %s log — part 3 (tail)\n```\n%s\n```" %
                       (name, "\n".join(lines[-400:])))
          PY
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Proves the gate, not the code. The step above trusts one line of output
  # ("RESULT: PASS") to decide whether the suite passed; if that gate were wrong,
  # every green run in this repository would be meaningless. This job runs the same
  # runner with a canary suite that contains one deliberately false assertion, and
  # **passes only when the gate rejects it**. It is manual-only, so it can never make
  # the normal workflow red, and the real suite never includes the canary.
  gate-self-check:
    name: Prove the test gate rejects a failing suite
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: false

      - name: Import project resources
        run: godot --headless --path . --import

      - name: Run the suite with the deliberately failing canary
        run: |
          set +e
          GD_SELF_CHECK=1 godot --headless --path . res://tests/test_runner.tscn \
            > /tmp/self_check.log 2>&1
          status=$?
          set -e
          echo "runner exit status: $status"
          grep -E "SELF-CHECK|test_self_check_negative|RESULT:" /tmp/self_check.log || true
          if ! grep -q "SELF-CHECK: the deliberately failing canary suite is included" \
              /tmp/self_check.log; then
            echo "the canary suite was not loaded, so this check proved nothing"
            exit 1
          fi
          if grep -q "^RESULT: PASS" /tmp/self_check.log; then
            echo "the gate accepted a run that contains a failing assertion"
            exit 1
          fi
          if ! grep -q "^RESULT: FAIL" /tmp/self_check.log; then
            echo "the run produced no verdict at all; the gate cannot be trusted"
            exit 1
          fi
          if ! grep -q "this assertion is false on purpose" /tmp/self_check.log; then
            echo "the failing assertion was not the canary's; something else broke"
            exit 1
          fi
          echo "the gate correctly rejected a failing suite"

      - name: Record the result as an annotation
        if: always()
        run: |
          python3 - <<'PY'
          try:
              lines = open("/tmp/self_check.log", errors="replace").read().splitlines()
          except OSError:
              print("::error title=self-check::no self-check log was produced")
              raise SystemExit(0)
          verdict = [line for line in lines if line.startswith("RESULT:")]
          total = [line for line in lines if line.startswith("Assertions:")]
          print("::notice title=self-check::%s (the canary must make this FAIL)" %
                (" | ".join(total + verdict) or "no verdict line"))
          PY
